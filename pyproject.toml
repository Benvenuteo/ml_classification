[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality-classification-study"
version = "1.0.0"
description = "Reproducible multiclass and binary air quality classification study"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2",
    "scikit-learn>=1.8,<1.9", "imbalanced-learn>=0.14.2,<0.15",
    "matplotlib>=3.10,<4", "jinja2>=3.1,<4", "joblib>=1.4,<2",
    "threadpoolctl>=3.5,<4", "nbformat>=5.10,<6", "nbclient>=0.10,<0.12",
    "ipykernel>=6.30,<8", "ipython>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.18"]

[project.scripts]
air-quality = "air_quality.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
air_quality = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
